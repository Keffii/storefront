<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
<defs>
<linearGradient id="body" x1="0" x2="1" y1="0" y2="0">
<stop offset="0" stop-color="#5d5d5d"/>
<stop offset="0.45" stop-color="#3A3A3A"/>
<stop offset="1" stop-color="#2a2a2a"/>
</linearGradient>
<!-- r=0.5 fades fully to cream at the edges, so images sit seamlessly on cream panels. -->
<radialGradient id="bg" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#FBF9F5"/>
<stop offset="1" stop-color="#F7F4EF"/>
</radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1200" height="1200" fill="url(#bg)"/>
<rect x="330" y="880" width="540" height="320" fill="#EDE7DC"/>
<rect x="330" y="880" width="540" height="10" fill="#E3DCCF"/>
<ellipse cx="600" cy="884" rx="200" ry="18" fill="#000" opacity="0.10" filter="url(#blur)"/>
<g transform="translate(600 880) scale(0.72) translate(-600 -970)">
<path d="M600 120 L600 300" stroke="#8C6E4F" stroke-width="10"/>
<circle cx="600" cy="560" r="270" fill="url(#body)"/>
<circle cx="600" cy="560" r="245" fill="#DCE3E3"/>
<path d="M440 470 C500 380 600 350 700 380" stroke="#FFFFFF" stroke-width="22" fill="none" stroke-linecap="round" opacity="0.6"/>
<ellipse cx="600" cy="968" rx="170" ry="10" fill="#000" opacity="0.05"/></g>
</svg>
