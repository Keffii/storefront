<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
<defs>
<linearGradient id="body" x1="0" x2="1" y1="0" y2="0">
<stop offset="0" stop-color="#a2a19d"/>
<stop offset="0.45" stop-color="#8E8C88"/>
<stop offset="1" stop-color="#666562"/>
</linearGradient>
<!-- r=0.5 fades fully to cream at the edges, so images sit seamlessly on cream panels. -->
<radialGradient id="bg" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#FBF9F5"/>
<stop offset="1" stop-color="#F7F4EF"/>
</radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1200" height="1200" fill="url(#bg)"/>
<ellipse cx="600" cy="975" rx="260" ry="26" fill="#000" opacity="0.10" filter="url(#blur)"/>
<path d="M440 600 L560 600 L552 960 L448 960 Z" fill="url(#body)" opacity="0.8"/>
<path d="M640 600 L760 600 L752 960 L648 960 Z" fill="url(#body)" opacity="0.8"/>
<ellipse cx="500" cy="600" rx="60" ry="10" fill="#72706d"/>
<ellipse cx="700" cy="600" rx="60" ry="10" fill="#72706d"/>
<path d="M465 640 L462 920 M665 640 L662 920" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
</svg>
