<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
<defs>
<linearGradient id="body" x1="0" x2="1" y1="0" y2="0">
<stop offset="0" stop-color="#ede9e1"/>
<stop offset="0.45" stop-color="#E9E4DA"/>
<stop offset="1" stop-color="#a8a49d"/>
</linearGradient>
<!-- r=0.5 fades fully to cream at the edges, so images sit seamlessly on cream panels. -->
<radialGradient id="bg" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#FBF9F5"/>
<stop offset="1" stop-color="#F7F4EF"/>
</radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1200" height="1200" fill="url(#bg)"/><g transform="translate(600 640) scale(1.9) translate(-600 600) translate(0 -1200)">
<rect x="300" y="560" width="600" height="36" rx="4" fill="url(#body)"/>
<rect x="300" y="520" width="600" height="40" fill="#cdc9c0"/>
<rect x="360" y="400" width="60" height="120" rx="6" fill="#7C8BA3"/>
<rect x="430" y="430" width="45" height="90" rx="6" fill="#B86B4B"/>
<path d="M700 520 L700 430 C700 400 760 400 760 430 L760 520 Z" fill="#7D7F5C"/>
<ellipse cx="600" cy="968" rx="200" ry="10" fill="#000" opacity="0.05"/></g>
</svg>
