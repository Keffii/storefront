<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
<defs>
<linearGradient id="body" x1="0" x2="1" y1="0" y2="0">
<stop offset="0" stop-color="#ede9e1"/>
<stop offset="0.45" stop-color="#E9E4DA"/>
<stop offset="1" stop-color="#a8a49d"/>
</linearGradient>
<!-- r=0.5 fades fully to cream at the edges, so images sit seamlessly on cream panels. -->
<radialGradient id="bg" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#FBF9F5"/>
<stop offset="1" stop-color="#F7F4EF"/>
</radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1200" height="1200" fill="url(#bg)"/>
<ellipse cx="600" cy="975" rx="260" ry="26" fill="#000" opacity="0.10" filter="url(#blur)"/>
<rect x="596" y="0" width="8" height="470" fill="#3A3A3A"/>
<rect x="580" y="455" width="40" height="40" rx="6" fill="#a3a099"/>
<path d="M400 720 C400 580 490 490 600 490 C710 490 800 580 800 720 Z" fill="url(#body)"/>
<ellipse cx="600" cy="720" rx="200" ry="22" fill="#a3a099"/>
<ellipse cx="600" cy="723" rx="160" ry="13" fill="#FFF6DD" opacity="0.85"/>
<ellipse cx="600" cy="968" rx="210" ry="12" fill="#FFF0C8" opacity="0.35"/>
</svg>
