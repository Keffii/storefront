<polygon points="655,640 680,640 725,968 700,968" fill="#313131"/>
<polygon points="589,650 611,650 613,940 587,940" fill="#262626"/>
<path d="M390 600 L810 600 L810 630 C810 655 716 672 600 672 C484 672 390 655 390 630 Z" fill="url(#body)"/>
<ellipse cx="600" cy="600" rx="210" ry="44" fill="#525252"/>
