name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      # Screenshot comparisons against baselines rendered on this same runner
      # image. Skipped until the "Update visual baselines" workflow has run once.
      - name: Visual regression
        if: hashFiles('tests/visual/__screenshots__/**') != ''
        run: npm run test:visual

      - name: Lighthouse budgets
        run: npx --yes @lhci/cli@0.14.0 autorun

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            playwright-report/
            playwright-visual-report/
            tests/visual/**/*-diff.png
            test-results/
            .lighthouseci/
          retention-days: 7
