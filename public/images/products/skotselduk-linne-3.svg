<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
<defs>
<linearGradient id="body" x1="0" x2="1" y1="0" y2="0">
<stop offset="0" stop-color="#ddd4c5"/>
<stop offset="0.45" stop-color="#D6CBB8"/>
<stop offset="1" stop-color="#9a9284"/>
</linearGradient>
<!-- r=0.5 fades fully to cream at the edges, so images sit seamlessly on cream panels. -->
<radialGradient id="bg" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#FBF9F5"/>
<stop offset="1" stop-color="#F7F4EF"/>
</radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1200" height="1200" fill="url(#bg)"/><g transform="translate(600 640) scale(1.9) translate(-600 600) translate(0 -1200)">
<rect x="370" y="880" width="460" height="88" rx="12" fill="#bcb3a2"/>
<rect x="390" y="800" width="420" height="88" rx="12" fill="url(#body)"/>
<rect x="410" y="720" width="380" height="88" rx="12" fill="#d9cfbe"/>
<rect x="690" y="740" width="60" height="34" rx="3" fill="#FFFFFF" opacity="0.8"/></g>
</svg>
