name: Update visual baselines

# Run by hand on a pull request's branch after an intended design change:
#   gh workflow run visual-baselines.yml --ref <branch>
# Renders the screenshot baselines on the same runner image as CI, commits
# them to that branch and starts CI again, since pushes made with the
# workflow token don't trigger it. main is protected and never targeted.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: http://localhost:3400
    steps:
      - name: Refuse to run on main
        if: github.ref_name == 'main'
        run: |
          echo "Run this on the pull request's branch, not on main."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      - name: Render baselines
        run: npm run test:visual -- --update-snapshots

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update visual baselines"
          git push
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
