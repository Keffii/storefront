name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Canonical URLs and the sitemap point at the server Lighthouse audits.
      SITE_URL: http://localhost:3400
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      # Screenshot comparisons against baselines rendered on this same runner
      # image. Skipped until the "Update visual baselines" workflow has run once.
      - name: Visual regression
        if: hashFiles('tests/visual/__screenshots__/**') != ''
        run: npm run test:visual

      - name: Lighthouse budgets
        run: npx --yes @lhci/cli@0.14.0 autorun

      - name: Show failing Lighthouse audits
        if: failure()
        run: node scripts/lighthouse-failures.mjs .lighthouseci

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          include-hidden-files: true
          path: |
            playwright-report/
            playwright-visual-report/
            tests/visual/**/*-diff.png
            test-results/
            .lighthouseci/
          retention-days: 7

  # Continuous deployment: each branch has its own Amplify environment, and it
  # is only updated when every check above has passed. develop deploys to the
  # test site, main (changed only through release pull requests) to
  # objekt.live. Pull requests and other branches never deploy.
  deploy:
    needs: test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Start the Amplify deploy
        env:
          AMPLIFY_WEBHOOK_URL: ${{ github.ref == 'refs/heads/main' && secrets.AMPLIFY_WEBHOOK_URL || secrets.AMPLIFY_WEBHOOK_URL_DEVELOP }}
          SITE: ${{ github.ref == 'refs/heads/main' && 'https://objekt.live' || 'https://develop.d9wg0b1285wyg.amplifyapp.com' }}
        run: |
          curl --fail --silent --show-error -X POST -H "Content-Type: application/json" -d '{}' "$AMPLIFY_WEBHOOK_URL" > /dev/null
          echo "Deploy started for ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Amplify publishes it to $SITE in about 6 minutes."
